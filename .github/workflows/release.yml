name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux
          - runner: macos-latest
            label: mac
          - runner: windows-latest
            label: windows

    runs-on: ${{ matrix.runner }}

    steps:
      - name: OS Label
        run: echo "${{ matrix.label }}"

      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Build the app
        working-directory: frontend/frontend
        shell: bash
        run: ./mvnw -Papp-image clean package

      - name: Show what jpackage produced
        working-directory: frontend/frontend
        shell: bash
        run: find target/dist -maxdepth 3

      - name: Zip - Linux
        if: matrix.label == 'linux'
        working-directory: frontend/frontend/target/dist/BP-Chat
        shell: bash
        run: zip -r ../../bpchat-linux.zip .

      - name: Zip - Windows
        if: matrix.label == 'windows'
        working-directory: frontend/frontend/target/dist/BP-Chat
        shell: bash
        run: 7z a ../../bpchat-windows.zip .

      - name: Zip - Mac
        if: matrix.label == 'mac'
        working-directory: frontend/frontend/target/dist
        shell: bash
        run: ditto -c -k --keepParent BP-Chat.app ../bpchat-mac.zip

      - name: Checksum - Linux and Windows
        if: matrix.label != 'mac'
        working-directory: frontend/frontend/target
        shell: bash
        run: sha256sum bpchat-${{ matrix.label }}.zip > bpchat-${{ matrix.label }}.zip.sha256

      - name: Checksum - Mac
        if: matrix.label == 'mac'
        working-directory: frontend/frontend/target
        shell: bash
        run: shasum -a 256 bpchat-mac.zip > bpchat-mac.zip.sha256

      - name: Show zips and checksums
        working-directory: frontend/frontend/target
        shell: bash
        run: ls -l bpchat-* && cat bpchat-*.sha256