name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux
          - runner: macos-latest
            label: mac
          - runner: windows-latest
            label: windows

    runs-on: ${{ matrix.runner }}

    steps:
      - name: OS Label
        run: echo "${{ matrix.label }}"

      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Build the app
        working-directory: frontend/frontend
        shell: bash
        run: ./mvnw -Papp-image clean package

      - name: Show what jpackage produced
        working-directory: frontend/frontend
        shell: bash
        run: find target/dist -maxdepth 3