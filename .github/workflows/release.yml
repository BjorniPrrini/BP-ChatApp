name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux
          - runner: macos-latest
            label: mac
          - runner: windows-latest
            label: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Build the app
        working-directory: frontend/frontend
        shell: bash
        run: ./mvnw -Papp-image clean package

      - name: Zip frontend - Linux
        if: matrix.label == 'linux'
        working-directory: frontend/frontend/target/dist/BP-Chat
        shell: bash
        run: zip -r ../../bpchat-linux.zip .

      - name: Zip frontend - Windows
        if: matrix.label == 'windows'
        working-directory: frontend/frontend/target/dist/BP-Chat
        shell: bash
        run: 7z a ../../bpchat-windows.zip .

      - name: Zip frontend - Mac
        if: matrix.label == 'mac'
        working-directory: frontend/frontend/target/dist
        shell: bash
        run: ditto -c -k --keepParent BP-Chat.app ../bpchat-mac.zip

      - name: Checksum - Linux and Windows
        if: matrix.label != 'mac'
        working-directory: frontend/frontend/target
        shell: bash
        run: sha256sum bpchat-${{ matrix.label }}.zip > bpchat-${{ matrix.label }}.zip.sha256

      - name: Checksum - Mac
        if: matrix.label == 'mac'
        working-directory: frontend/frontend/target
        shell: bash
        run: shasum -a 256 bpchat-mac.zip > bpchat-mac.zip.sha256

      - name: Build the launcher
        working-directory: launcher
        shell: bash
        run: ./mvnw -Papp-image clean package

      - name: Zip launcher - Linux
        if: matrix.label == 'linux'
        working-directory: launcher/target/dist
        shell: bash
        run: zip -r ../bpchat-launcher-linux.zip BP-Chat-Launcher

      - name: Zip launcher - Windows
        if: matrix.label == 'windows'
        working-directory: launcher/target/dist
        shell: bash
        run: 7z a ../bpchat-launcher-windows.zip BP-Chat-Launcher

      - name: Zip launcher - Mac
        if: matrix.label == 'mac'
        working-directory: launcher/target/dist
        shell: bash
        run: ditto -c -k --keepParent BP-Chat-Launcher.app ../bpchat-launcher-mac.zip

      - name: Collect release files
        shell: bash
        run: |
          mkdir release-files
          cp frontend/frontend/target/bpchat-${{ matrix.label }}.zip release-files/
          cp frontend/frontend/target/bpchat-${{ matrix.label }}.zip.sha256 release-files/
          cp launcher/target/bpchat-launcher-${{ matrix.label }}.zip release-files/
          ls -l release-files

      - name: Save release files
        uses: actions/upload-artifact@v6
        with:
          name: bpchat-${{ matrix.label }}
          path: release-files/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --repo "${{ github.repository }}" --generate-notes