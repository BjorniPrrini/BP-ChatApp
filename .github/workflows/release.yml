name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux
          - runner: macos-latest
            label: mac
          - runner: windows-latest
            label: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: OS Label
        run: echo "${{ matrix.label }}"