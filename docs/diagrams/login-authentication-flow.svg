<svg xmlns="http://www.w3.org/2000/svg" width="1086" height="656" viewBox="0 0 1086 656" role="img" aria-labelledby="title desc">
<title id="title">Login and authenticated REST flow</title><desc id="desc">Sequence diagram with participant lanes and vertically ordered message events.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a} .hdr{font-size:13px;font-weight:600} .msg{font-size:12px} .ctrl{font-size:12px;font-weight:600} .lane{stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:5 5} .req{stroke:#475569;stroke-width:1.4;fill:none;marker-end:url(#arrow)} .resp{stroke:#64748b;stroke-width:1.4;stroke-dasharray:6 4;fill:none;marker-end:url(#arrow)} .self{stroke:#475569;stroke-width:1.4;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="55.0" y="28" width="151" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text class="hdr" text-anchor="middle" x="130.5" y="53.0">LoginController</text>
<rect x="220.0" y="28" width="151" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text class="hdr" text-anchor="middle" x="295.5" y="53.0">AuthService</text>
<rect x="385.0" y="28" width="151" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text class="hdr" text-anchor="middle" x="460.5" y="53.0">AuthController</text>
<rect x="550.0" y="28" width="151" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text class="hdr" text-anchor="middle" x="625.5" y="53.0">Spring Security</text>
<rect x="715.0" y="28" width="151" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text class="hdr" text-anchor="middle" x="790.5" y="53.0">UserRepository</text>
<rect x="880.0" y="28" width="151" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text class="hdr" text-anchor="middle" x="955.5" y="53.0">SessionManager</text>
<line class="lane" x1="130.5" y1="80" x2="130.5" y2="634"/>
<line class="lane" x1="295.5" y1="80" x2="295.5" y2="634"/>
<line class="lane" x1="460.5" y1="80" x2="460.5" y2="634"/>
<line class="lane" x1="625.5" y1="80" x2="625.5" y2="634"/>
<line class="lane" x1="790.5" y1="80" x2="790.5" y2="634"/>
<line class="lane" x1="955.5" y1="80" x2="955.5" y2="634"/>
<text class="msg" text-anchor="middle" x="213.0" y="102.0">login credentials</text>
<line class="req" x1="135.5" y1="123.0" x2="288.5" y2="123.0"/>
<title>LoginController → AuthService: login credentials</title>
<text class="msg" text-anchor="middle" x="378.0" y="150.0">POST</text>
<text class="msg" text-anchor="middle" x="378.0" y="165.0">/api/auth/login</text>
<line class="req" x1="300.5" y1="186.0" x2="453.5" y2="186.0"/>
<title>AuthService → AuthController: POST /api/auth/login</title>
<text class="msg" text-anchor="middle" x="625.5" y="206.0">lookup account / verify credentials</text>
<text class="msg" text-anchor="middle" x="625.5" y="221.0">through service</text>
<line class="req" x1="465.5" y1="242.0" x2="783.5" y2="242.0"/>
<title>AuthController → UserRepository: lookup account / verify credentials through service</title>
<text class="msg" text-anchor="middle" x="625.5" y="262.0">account data</text>
<line class="resp" x1="785.5" y1="283.0" x2="467.5" y2="283.0"/>
<title>UserRepository → AuthController: account data</title>
<text class="msg" text-anchor="middle" x="378.0" y="310.0">AuthResponseDTO</text>
<text class="msg" text-anchor="middle" x="378.0" y="325.0">with token</text>
<line class="resp" x1="455.5" y1="346.0" x2="302.5" y2="346.0"/>
<title>AuthController → AuthService: AuthResponseDTO with token</title>
<text class="msg" text-anchor="middle" x="625.5" y="366.0">save active session/token</text>
<line class="resp" x1="300.5" y1="387.0" x2="948.5" y2="387.0"/>
<title>AuthService → SessionManager: save active session/token</title>
<text class="msg" text-anchor="middle" x="543.0" y="414.0">authenticated session</text>
<line class="resp" x1="950.5" y1="435.0" x2="137.5" y2="435.0"/>
<title>SessionManager → LoginController: authenticated session</title>
<text class="msg" text-anchor="middle" x="295.5" y="462.0">subsequent protected request with Bearer</text>
<text class="msg" text-anchor="middle" x="295.5" y="477.0">token</text>
<line class="req" x1="135.5" y1="498.0" x2="453.5" y2="498.0"/>
<title>LoginController → AuthController: subsequent protected request with Bearer token</title>
<text class="msg" text-anchor="middle" x="543.0" y="518.0">JwtAuthFilter</text>
<text class="msg" text-anchor="middle" x="543.0" y="533.0">validates token</text>
<line class="req" x1="465.5" y1="554.0" x2="618.5" y2="554.0"/>
<title>AuthController → Spring Security: JwtAuthFilter validates token</title>
<text class="msg" text-anchor="middle" x="543.0" y="574.0">authenticated</text>
<text class="msg" text-anchor="middle" x="543.0" y="589.0">principal</text>
<line class="resp" x1="620.5" y1="610.0" x2="467.5" y2="610.0"/>
<title>Spring Security → AuthController: authenticated principal</title>
</svg>