<svg xmlns="http://www.w3.org/2000/svg" width="1581" height="1053" viewBox="0 0 1581 1053" role="img" aria-labelledby="title desc">
<title id="title">Launcher update lifecycle</title><desc id="desc">Sequence diagram with participant lanes and vertically ordered message events.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a} .hdr{font-size:13px;font-weight:600} .msg{font-size:12px} .ctrl{font-size:12px;font-weight:600} .lane{stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:5 5} .req{stroke:#475569;stroke-width:1.4;fill:none;marker-end:url(#arrow)} .resp{stroke:#64748b;stroke-width:1.4;stroke-dasharray:6 4;fill:none;marker-end:url(#arrow)} .self{stroke:#475569;stroke-width:1.4;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="55.0" y="28" width="151" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text class="hdr" text-anchor="middle" x="130.5" y="53.0">User</text>
<rect x="220.0" y="28" width="151" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text class="hdr" text-anchor="middle" x="295.5" y="47.0">LauncherPageControll</text>
<text class="hdr" text-anchor="middle" x="295.5" y="63.0">er</text>
<rect x="385.0" y="28" width="151" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text class="hdr" text-anchor="middle" x="460.5" y="53.0">UpdateManager</text>
<rect x="550.0" y="28" width="151" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text class="hdr" text-anchor="middle" x="625.5" y="53.0">ReleaseClient/GitHub</text>
<rect x="715.0" y="28" width="151" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text class="hdr" text-anchor="middle" x="790.5" y="53.0">Downloader</text>
<rect x="880.0" y="28" width="151" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text class="hdr" text-anchor="middle" x="955.5" y="53.0">ChecksumUtil</text>
<rect x="1045.0" y="28" width="151" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text class="hdr" text-anchor="middle" x="1120.5" y="53.0">Installer</text>
<rect x="1210.0" y="28" width="151" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text class="hdr" text-anchor="middle" x="1285.5" y="53.0">InstallStore</text>
<rect x="1375.0" y="28" width="151" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text class="hdr" text-anchor="middle" x="1450.5" y="53.0">FrontendStarter</text>
<line class="lane" x1="130.5" y1="80" x2="130.5" y2="1031"/>
<line class="lane" x1="295.5" y1="80" x2="295.5" y2="1031"/>
<line class="lane" x1="460.5" y1="80" x2="460.5" y2="1031"/>
<line class="lane" x1="625.5" y1="80" x2="625.5" y2="1031"/>
<line class="lane" x1="790.5" y1="80" x2="790.5" y2="1031"/>
<line class="lane" x1="955.5" y1="80" x2="955.5" y2="1031"/>
<line class="lane" x1="1120.5" y1="80" x2="1120.5" y2="1031"/>
<line class="lane" x1="1285.5" y1="80" x2="1285.5" y2="1031"/>
<line class="lane" x1="1450.5" y1="80" x2="1450.5" y2="1031"/>
<text class="msg" text-anchor="middle" x="213.0" y="102.0">Open launcher /</text>
<text class="msg" text-anchor="middle" x="213.0" y="117.0">request launch</text>
<line class="req" x1="135.5" y1="138.0" x2="288.5" y2="138.0"/>
<title>User → LauncherPageController: Open launcher / request launch</title>
<text class="msg" text-anchor="middle" x="378.0" y="158.0">Start update check</text>
<line class="req" x1="300.5" y1="179.0" x2="453.5" y2="179.0"/>
<title>LauncherPageController → UpdateManager: Start update check</title>
<text class="msg" text-anchor="middle" x="543.0" y="206.0">Fetch latest</text>
<text class="msg" text-anchor="middle" x="543.0" y="221.0">release</text>
<line class="req" x1="465.5" y1="242.0" x2="618.5" y2="242.0"/>
<title>UpdateManager → ReleaseClient/GitHub: Fetch latest release</title>
<text class="msg" text-anchor="middle" x="543.0" y="262.0">ReleaseInfo and</text>
<text class="msg" text-anchor="middle" x="543.0" y="277.0">assets</text>
<line class="resp" x1="620.5" y1="298.0" x2="467.5" y2="298.0"/>
<title>ReleaseClient/GitHub → UpdateManager: ReleaseInfo and assets</title>
<text class="msg" x="482.5" y="318.0">Detect OS and</text>
<text class="msg" x="482.5" y="333.0">compare versions</text>
<path class="self" d="M 460.5 354.0 h 34 v 13 h -32 "/>
<title>UpdateManager → UpdateManager: Detect OS and compare versions</title>
<rect x="18" y="360" width="1545" height="33" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
<text class="ctrl" x="30" y="379">ALT · Update required</text>
<text class="msg" text-anchor="middle" x="625.5" y="412.0">Download platform ZIP</text>
<line class="req" x1="465.5" y1="433.0" x2="783.5" y2="433.0"/>
<title>UpdateManager → Downloader: Download platform ZIP</title>
<text class="msg" text-anchor="middle" x="625.5" y="460.0">Downloaded temporary file</text>
<line class="resp" x1="785.5" y1="481.0" x2="467.5" y2="481.0"/>
<title>Downloader → UpdateManager: Downloaded temporary file</title>
<text class="msg" text-anchor="middle" x="708.0" y="508.0">Verify matching SHA-256</text>
<line class="req" x1="465.5" y1="529.0" x2="948.5" y2="529.0"/>
<title>UpdateManager → ChecksumUtil: Verify matching SHA-256</title>
<text class="msg" text-anchor="middle" x="708.0" y="556.0">Valid / invalid</text>
<line class="resp" x1="950.5" y1="577.0" x2="467.5" y2="577.0"/>
<title>ChecksumUtil → UpdateManager: Valid / invalid</title>
<rect x="18" y="590" width="1545" height="33" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
<text class="ctrl" x="30" y="609">ALT · Checksum valid</text>
<text class="msg" text-anchor="middle" x="790.5" y="642.0">Stage and replace installed frontend</text>
<line class="req" x1="465.5" y1="663.0" x2="1113.5" y2="663.0"/>
<title>UpdateManager → Installer: Stage and replace installed frontend</title>
<text class="msg" text-anchor="middle" x="1203.0" y="690.0">Save installed</text>
<text class="msg" text-anchor="middle" x="1203.0" y="705.0">state</text>
<line class="req" x1="1125.5" y1="726.0" x2="1278.5" y2="726.0"/>
<title>Installer → InstallStore: Save installed state</title>
<text class="msg" text-anchor="middle" x="955.5" y="746.0">Start installed frontend</text>
<line class="req" x1="465.5" y1="767.0" x2="1443.5" y2="767.0"/>
<title>UpdateManager → FrontendStarter: Start installed frontend</title>
<rect x="18" y="780" width="1545" height="33" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
<text class="ctrl" x="30" y="799">ELSE · Checksum invalid</text>
<text class="msg" text-anchor="middle" x="378.0" y="832.0">Failure state - do</text>
<text class="msg" text-anchor="middle" x="378.0" y="847.0">not install</text>
<text class="msg" text-anchor="middle" x="378.0" y="862.0">untrusted file;</text>
<line class="resp" x1="455.5" y1="883.0" x2="302.5" y2="883.0"/>
<title>UpdateManager → LauncherPageController: Failure state - do not install untrusted file;</title>
<line x1="28" y1="898.0" x2="1553" y2="898.0" stroke="#e2e8f0" stroke-width="1"/>
<rect x="18" y="905" width="1545" height="33" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
<text class="ctrl" x="30" y="924">ELSE · Already current / no usable release</text>
<text class="msg" text-anchor="middle" x="378.0" y="957.0">Status or failure</text>
<text class="msg" text-anchor="middle" x="378.0" y="972.0">state</text>
<line class="resp" x1="455.5" y1="993.0" x2="302.5" y2="993.0"/>
<title>UpdateManager → LauncherPageController: Status or failure state</title>
<line x1="28" y1="1006.0" x2="1553" y2="1006.0" stroke="#e2e8f0" stroke-width="1"/>
</svg>